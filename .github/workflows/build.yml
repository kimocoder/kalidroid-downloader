name: Build Rolling APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Publish rolling release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kalidroid.apk
          SHORT_SHA=$(git rev-parse --short HEAD)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest kalidroid.apk --clobber
            gh release edit latest --title "Latest Build ($SHORT_SHA)" --notes "Automated build from commit ${{ github.sha }}" --target "${{ github.sha }}"
          else
            gh release create latest kalidroid.apk --title "Latest Build ($SHORT_SHA)" --notes "Automated build from commit ${{ github.sha }}" --target "${{ github.sha }}"
          fi
